<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFCB3D">
<title>Habit Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23FFCB3D'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23FFCB3D'/%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

  :root{
    --paper: #FDFDFB;
    --surface: #FFFFFF;
    --ink: #2E2A22;
    --ink-muted: #8B8477;
    --moss: #8FB89C;
    --moss-dim: #E4F5EA;
    --sky: #93BAD1;
    --sky-dim: #E6F4FB;
    --teal: #8FBAB4;
    --coral: #E3A98F;
    --coral-dim: #FFEBE4;
    --berry: #CB93A6;
    --lilac: #ADA3D0;
    --sun: #FFCB3D;
    --sun-dim: #FFF9E5;
    --border: #ECE8DC;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html{ height:100%; }
  body{
    margin:0; min-height:100vh; min-height:100dvh; background: var(--paper); color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif; font-size: 16.5px; line-height: 1.5;
    padding-bottom: 60px;
    padding-bottom: max(60px, env(safe-area-inset-bottom, 60px));
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a{ color:inherit; }
  button{ font-family:inherit; -webkit-appearance:none; appearance:none; }
  input, select, textarea{ font-size:16px; }

  .spot{ border-radius:50%; background: var(--sun); flex-shrink:0; }

  #loginScreen{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 24px; text-align:center; }
  #loginScreen .spot-lg{ width:88px; height:88px; margin-bottom:20px; }
  #loginScreen h1{ font-size:30px; font-weight:900; margin: 0 0 8px; }
  #loginScreen p{ color: var(--ink-muted); margin: 0 0 30px; font-size:14.5px; }
  #googleBtn{ display:flex; align-items:center; gap:10px; background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 13px 24px; font-size: 15px; font-weight:700; color: var(--ink); cursor:pointer; }
  #googleBtn svg{ width:19px; height:19px; }
  #loginStatus{ margin-top:14px; font-size:13px; color: var(--ink-muted); min-height: 18px; }

  #app{ max-width: 640px; margin: 0 auto; padding: 22px 18px 0; }
  #app[hidden]{ display:none; }
  header.top{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 20px; }
  header.top .brand{ display:flex; align-items:center; gap:9px; }
  header.top .brand .spot{ width:24px; height:24px; }
  header.top .brand h1{ font-size:18px; font-weight:900; margin:0; }
  header.top .user{ display:flex; align-items:center; gap:9px; }
  header.top .user img{ width:28px; height:28px; border-radius:50%; }
  header.top .user button{ background:none; border:none; color: var(--ink-muted); font-size:12.5px; cursor:pointer; text-decoration:underline; padding:0; }

  nav.tabs{ display:flex; gap: 22px; border-bottom: 2px solid var(--border); margin-bottom: 24px; }
  nav.tabs button{ border:none; background:transparent; padding: 0 2px 11px; font-size: 15px; font-weight:700; color: var(--ink-muted); cursor:pointer; border-bottom: 3px solid transparent; margin-bottom:-2px; }
  nav.tabs button.active{ color: var(--ink); border-bottom-color: var(--sun); }

  section.tab{ display:none; }
  section.tab.active{ display:block; }

  .hero{ margin-bottom: 24px; background: var(--sun-dim); border-radius: 22px; padding: 20px 22px; position:relative; overflow:hidden; }
  .hero .spot{ position:absolute; right:18px; top:18px; width:30px; height:30px; }
  .hero .date-meta{ font-size:13px; letter-spacing:1px; color:#8a6a1a; font-weight:700; margin-bottom:14px; }
  .hero .hero-label{ font-size:13px; color: var(--ink-muted); font-weight:700; margin-bottom:2px; }
  .hero .progress-line .frac{ font-weight:900; font-size:42px; color: var(--ink); letter-spacing:-0.5px; }
  .hero .progress-line .frac .of{ font-size:20px; color: var(--ink-muted); font-weight:700; }
  .hero .hero-sub{ font-size:13.5px; color: var(--ink-muted); margin-top:4px; }
  .hero .track{ height:8px; background: rgba(255,255,255,0.75); border-radius:999px; margin-top:12px; overflow:hidden; max-width:70%; }
  .hero .track .fill{ height:100%; background: var(--sun); border-radius:999px; transition: width .3s ease; }

  /* ---------- Habit row: CSS Grid, fixed columns, no layout shift ---------- */
  .habit-row{
    display:grid;
    grid-template-columns: 28px 1fr 34px;
    align-items:center;
    column-gap:10px;
    row-gap:8px;
    padding: 15px 4px;
    border-bottom: 1px solid var(--border);
  }
  .habit-row:last-child{ border-bottom:none; }
  .habit-row.dim{ opacity:0.45; grid-template-columns: 28px 1fr auto; }
  .habit-row .badge{ grid-column:1; width:11px; height:11px; border-radius:50%; justify-self:center; align-self:start; margin-top:6px; }
  .habit-row .info{ grid-column:2; min-width:0; display:flex; align-items:center; flex-wrap:wrap; column-gap:8px; row-gap:5px; cursor:pointer; }
  .quick-chips-inline{ display:flex; gap:5px; flex-wrap:wrap; flex-basis:100%; margin-top:2px; cursor:default; }
  .qty-row .info{ cursor:default; }
  .habit-row .name{ font-weight:700; font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .habit-row .dim-tag{ grid-column:3; font-size:12px; color: var(--ink-muted); justify-self:end; white-space:nowrap; }

  .checkbox{ grid-column:1; align-self:center; width:26px; height:26px; border:2.5px solid var(--border); border-radius:9px; background:var(--surface); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; transition: background .12s ease, border-color .12s ease, transform .12s ease; }
  .checkbox svg{ width:16px; height:16px; color:#fff; }
  .checkbox.checked{ transform: scale(1.05); }

  .expand-btn{ grid-column:3; align-self:start; }
  .icon-btn{ width:34px; height:34px; border:none; background:none; color: var(--ink-muted); opacity:0.55; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:8px; padding:0; justify-self:center; }
  .icon-btn:active{ opacity:1; background: var(--sun-dim); }
  .icon-btn svg{ width:16px; height:16px; }
  .expand-btn svg{ transition: transform .15s ease; }
  .expand-btn.open svg{ transform: rotate(180deg); }

  .qty-inline{ margin-left:auto; font-weight:700; font-size:15px; color: var(--ink); display:flex; align-items:center; gap:3px; white-space:nowrap; }
  .qty-inline .goal{ font-size:15px; font-weight:500; color: var(--ink-muted); }
  .qty-inline .unit{ font-size:15px; font-weight:500; color: var(--ink-muted); }
  .quick-chips-inline button{ background: var(--sky-dim); color:#276a8c; border:none; border-radius:8px; padding:6px 11px; font-size:12.5px; font-weight:700; cursor:pointer; }

  .row-detail{ grid-column: 1 / -1; padding-top:6px; }
  .detail-line{ display:flex; justify-content:space-between; align-items:center; font-size:13.5px; padding:5px 0; border-bottom:1px solid var(--border); }
  .detail-line:last-child{ border-bottom:none; }
  .detail-muted{ font-size:13px; color: var(--ink-muted); padding:4px 0; }
  .add-entry-inline{ display:flex; gap:6px; align-items:center; margin-top:8px; }
  .icon-text-btn{ display:inline-flex; align-items:center; gap:5px; background: var(--sun-dim); color:#8a6a1a; border:none; border-radius:8px; padding:8px 13px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .icon-text-btn svg{ width:13px; height:13px; }
  .add-entry-inline input{ width:76px; border:1px solid var(--border); border-radius:8px; padding:7px; background:var(--paper); }
  .add-entry-inline button{ background: var(--sun-dim); color:#8a6a1a; border:none; border-radius:8px; padding:7px 12px; font-size:12.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:4px; }
  .add-entry-inline button svg{ width:12px; height:12px; }

  .empty-state{ text-align:center; padding: 56px 20px; color: var(--ink-muted); }
  .empty-state .spot-lg{ width:72px; height:72px; margin: 0 auto 16px; }
  .empty-state h3{ font-size:17px; color: var(--ink); font-weight:900; margin:0 0 6px; }
  .empty-state p{ font-size:14px; margin:0 0 16px; }
  .empty-state button{ background: var(--ink); color:#fff; border:none; border-radius:12px; padding:11px 22px; font-weight:700; font-size:14px; cursor:pointer; }

  .section-label{ font-size:12px; letter-spacing:1px; color:var(--ink-muted); font-weight:900; margin: 24px 0 10px; }
  .section-label:first-child{ margin-top:0; }
  .manage-row{ padding: 12px 2px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .manage-row .info b{ font-size:15px; font-weight:700; }
  .manage-row .info .meta-line{ font-size:12px; color: var(--ink-muted); margin-top:2px; }
  .manage-row.disabled .info b{ color: var(--ink-muted); text-decoration: line-through; }
  .manage-row .link-actions{ display:flex; gap:12px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; }
  .manage-row .link-actions button{ background:none; border:none; font-size:12.5px; color: var(--moss); text-decoration:underline; cursor:pointer; padding:2px 0; font-weight:600; }
  .manage-row .link-actions button.muted{ color: var(--ink-muted); }
  .manage-row .link-actions button.danger{ color: var(--berry); }

  .add-btn-row{ margin-bottom: 6px; }
  .add-btn-row button{ background: var(--ink); color:#fff; border:none; border-radius:12px; padding: 11px 16px; font-weight:700; font-size:14px; cursor:pointer; }
  .add-btn-row.small button{ background: var(--surface); border:2px solid var(--border); color: var(--ink); padding:9px 14px; font-size:13px; }

  .form-panel{ background: var(--surface); border:2px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 18px; }
  .form-panel h3{ font-size:16px; font-weight:900; margin:0 0 12px; }
  .field{ margin-bottom: 12px; }
  .field label{ display:block; font-size:12.5px; color: var(--ink-muted); margin-bottom:5px; font-weight:700; }
  .field input, .field select, .field textarea{ width:100%; border:1.5px solid var(--border); border-radius:10px; padding: 11px; outline:none; font-family:'Noto Sans TC',sans-serif; background: var(--paper); }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--sun); }
  .field textarea{ resize:vertical; min-height:52px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .hint{ font-size:11.5px; color:#a39c86; margin-top:4px; }

  .daypick{ display:flex; gap:6px; }
  .daypick label{ flex:1; text-align:center; }
  .daypick input{ display:none; }
  .daypick span{ display:block; padding:9px 0; border:1.5px solid var(--border); border-radius:8px; font-size:12.5px; color: var(--ink-muted); cursor:pointer; }
  .daypick .dc-on span{ background: var(--sun-dim); border-color: var(--sun); color:#8a6a1a; font-weight:700; }

  details.adv{ margin-bottom: 12px; }
  details.adv summary{ font-size:13px; color: var(--moss); cursor:pointer; font-weight:700; padding:8px 0; }
  details.adv .adv-body{ padding-top:8px; }

  .type-picker{ display:flex; flex-direction:column; gap:7px; }
  .type-option{ display:flex; align-items:flex-start; gap:10px; border:1.5px solid var(--border); border-radius:12px; padding:11px 12px; cursor:pointer; }
  .type-option.tp-checked{ border-color: var(--sun); background: var(--sun-dim); }
  .type-option input{ width:auto; margin-top:3px; accent-color: var(--sun); }
  .type-option div{ display:flex; flex-direction:column; gap:2px; }
  .type-option b{ font-size:14px; }
  .type-option span{ font-size:12.5px; color: var(--ink-muted); }

  .form-actions{ display:flex; gap:10px; margin-top:4px; }
  .form-actions .primary{ flex:1; background: var(--ink); color:#fff; border:none; border-radius:10px; padding:12px; font-weight:700; font-size:14.5px; cursor:pointer; }
  .form-actions .ghost{ background:none; border:none; color: var(--ink-muted); font-size:13px; text-decoration:underline; cursor:pointer; }

  .record-heading{ font-size:20px; font-weight:900; margin:2px 0 18px; }

  .dash-card{ background: var(--sun-dim); border-radius: 22px; padding: 22px 24px; margin-bottom:18px; position:relative; overflow:hidden; }
  .dash-card .spot{ position:absolute; right:20px; top:20px; width:24px; height:24px; }
  .dash-card .cap{ font-size:12.5px; font-weight:700; color:#8a6a1a; letter-spacing:0.5px; margin-bottom:8px; }
  .dash-card .num{ font-size:52px; font-weight:900; color: var(--ink); letter-spacing:-1px; line-height:1; }
  .dash-card .delta{ font-size:13px; font-weight:700; margin-top:10px; display:inline-block; padding:4px 12px; border-radius:999px; background:rgba(255,255,255,0.75); }
  .dash-card .delta.up{ color: #2a7a48; }
  .dash-card .delta.down{ color: #c15a3d; }
  .dash-card .delta.flat{ color: var(--ink-muted); }

  .stat-pair{ display:flex; gap:14px; margin: 0 0 22px; }
  .stat-pill{ flex:1; border-radius:16px; padding:14px 16px; }
  .stat-pill.good{ background: var(--moss-dim); }
  .stat-pill.warn{ background: var(--coral-dim); }
  .stat-pill .lbl{ font-size:11.5px; font-weight:700; letter-spacing:0.5px; margin-bottom:6px; }
  .stat-pill.good .lbl{ color:#2a7a48; }
  .stat-pill.warn .lbl{ color:#c15a3d; }
  .stat-pill .name{ font-size:16px; font-weight:900; }
  .stat-pill .ratio{ font-size:12.5px; color: var(--ink-muted); margin-top:2px; }

  .cat-stat-row{ display:flex; align-items:center; gap:12px; padding:9px 2px; }
  .cat-stat-row .lbl{ width:80px; flex-shrink:0; font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cat-stat-row .track{ flex:1; height:8px; background: var(--border); border-radius:999px; overflow:hidden; }
  .cat-stat-row .fill{ height:100%; background: var(--sun); border-radius:999px; }
  .cat-stat-row .pct{ width:42px; flex-shrink:0; text-align:right; font-size:13.5px; font-weight:700; }

  .cum-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 2px; border-bottom:1px solid var(--border); }
  .cum-row:last-child{ border-bottom:none; }
  .cum-row .lbl{ font-size:14.5px; font-weight:700; }
  .cum-row .num{ font-size:14px; font-weight:700; color: var(--ink-muted); }

  .week-card{ background: var(--surface); border:2px solid var(--border); border-radius:18px; padding:16px 14px; margin-bottom:24px; }
  .week-head-row{ display:flex; align-items:center; padding-bottom:10px; margin-bottom:8px; border-bottom:1.5px solid var(--border); }
  .week-head-row .wk-name{ width:74px; flex-shrink:0; }
  .week-head-row .wk-cols{ flex:1; display:grid; grid-template-columns: repeat(7,1fr); }
  .wk-col-head{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .wk-col-head .wd{ font-size:11px; color: var(--ink-muted); font-weight:700; }
  .wk-col-head .dd{ font-size:12.5px; color: var(--ink-muted); font-weight:700; }
  .wk-col-head.is-today .dd{ color:#fff; background: var(--ink); width:19px; height:19px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .week-table-row{ display:flex; align-items:center; padding: 8px 0; }
  .wk-name{ font-size:13px; font-weight:700; flex-shrink:0; width:74px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wk-cols{ flex:1; display:grid; grid-template-columns: repeat(7,1fr); }
  .wk-chip-wrap{ display:flex; align-items:center; justify-content:center; }
  .wk-chip{ width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:900; color:#fff; }
  .wk-chip.miss{ border:1.5px solid var(--border); background:transparent; }
  .wk-chip.skip{ background: var(--border); color: var(--ink-muted); font-size:13px; }
  .wk-chip.na{ }

  .habit-chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:16px; -webkit-overflow-scrolling: touch; }
  .habit-chips button{ flex-shrink:0; border: 1.5px solid var(--border); background: var(--surface); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight:600; color: var(--ink-muted); cursor:pointer; }
  .habit-chips button.active{ background: var(--ink); border-color: var(--ink); color:#fff; }

  .day-detail-panel{ margin-top:14px; background: var(--surface); border:2px solid var(--border); border-radius:14px; padding:16px; }
  .day-detail-date{ font-size:15px; font-weight:900; margin-bottom:4px; }
  .day-detail-habit{ font-size:13.5px; color: var(--ink-muted); margin-bottom:12px; display:flex; align-items:center; gap:7px; }
  .day-detail-habit .dd-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .day-detail-status{ font-size:16px; font-weight:900; margin-bottom:8px; }
  .day-detail-entry{ display:flex; justify-content:space-between; font-size:14px; padding:5px 0; border-bottom:1px solid var(--border); }
  .day-detail-entry:last-child{ border-bottom:none; }
  .day-detail-empty{ color: var(--ink-muted); font-size:13.5px; }
  .day-detail-list-line{ display:flex; align-items:center; gap:8px; font-size:14.5px; padding:6px 0; }
  .day-detail-list-line .dd-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .day-detail-list-line .mark{ font-weight:900; width:14px; flex-shrink:0; }
  .day-detail-list-line.not-done{ color: var(--ink-muted); }
  .day-detail-group-lbl{ font-size:11px; font-weight:700; color: var(--ink-muted); letter-spacing:0.5px; margin:10px 0 4px; }
  .day-detail-group-lbl:first-of-type{ margin-top:0; }

  .cal-nav{ display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom: 14px; }
  .cal-nav button{ background:none; border:none; color: var(--ink); font-size:20px; font-weight:900; cursor:pointer; line-height:1; padding:6px 10px; }
  .cal-nav .label{ font-size:14.5px; font-weight:900; min-width:90px; text-align:center; }
  .cal-weekdays{ display:grid; grid-template-columns: repeat(7,1fr); margin-bottom:6px; }
  .cal-weekdays div{ text-align:center; font-size:11.5px; color: var(--ink-muted); font-weight:700; }
  .cal-days{ display:grid; grid-template-columns: repeat(7,1fr); gap:5px; }
  .cal-cell{
    aspect-ratio:0.85;
    display:grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    justify-items:center;
    align-items:center;
    border:1.5px solid var(--border);
    border-radius:10px;
    cursor:pointer;
    padding:7px 2px 6px;
    font-size:12.5px;
    color: var(--ink-muted);
  }
  .cal-cell.pad{ border-color:transparent; cursor:default; }
  .cal-cell .cal-d{ font-weight:700; align-self:start; width:100%; text-align:center; }
  .cal-cell .cal-dot-holder{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; gap:2px; flex-wrap:wrap; }
  .cal-cell .cal-dot{ width:11px; height:11px; border-radius:50%; }
  .cal-cell .cal-dot.mini{ width:6px; height:6px; }
  .cal-cell .cal-more{ font-size:9px; color: var(--ink-muted); font-weight:700; }
  .cal-cell.today{ box-shadow: inset 0 0 0 2px var(--sun); background: var(--sun-dim); font-weight:900; }
  .cal-cell.selected{ background: var(--ink); border-color: var(--ink); color: rgba(255,255,255,0.75); }
  .cal-cell.selected .cal-d{ color:#fff; }
  .cal-cell.selected.today{ box-shadow: inset 0 0 0 2px var(--sun); }

  .settings-row{ padding: 14px 2px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .settings-row .lbl{ font-size:14.5px; font-weight:700; }
  .settings-row .desc{ font-size:12px; color: var(--ink-muted); margin-top:2px; }
  .settings-row button{ background: var(--surface); border:1.5px solid var(--border); border-radius:10px; padding:9px 14px; font-size:13px; font-weight:700; cursor:pointer; color: var(--ink); flex-shrink:0; }

  @media (max-width:420px){
    .hero .progress-line .frac{ font-size:34px; }
    .dash-card .num{ font-size:42px; }
    nav.tabs{ gap:16px; }
    .wk-name, .week-head-row .wk-name{ width:56px; font-size:12px; }
    .cat-stat-row .lbl, .cum-row .lbl{ width:60px; }
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="spot spot-lg"></div>
  <h1>Habit Tracker</h1>
  <p>登入後,習慣紀錄會同步保存。</p>
  <button id="googleBtn">

function safeSessionSet(key, val){
  try{ sessionStorage.setItem(key, val); }catch(e){ /* Private Browsing may block this — ignore */ }

function safeSessionGet(key){
  try{ return sessionStorage.getItem(key); }catch(e){ return null; }

function safeSessionRemove(key){

}
function describeError(e){
  if(!e) return '未知錯誤';
  const parts = [];
  if(e.code) parts.push(e.code);
  if(e.name && e.name !== e.code) parts.push(e.name);
  if(e.message) parts.push(e.message);
  return parts.length ? parts.join(' · ') : String(e);
}

/* ---------- Migration ---------- */
function migrateState(raw){
  const s = raw && typeof raw === 'object' ? JSON.parse(JSON.stringify(raw)) : {};
  s.habits = Array.isArray(s.habits) ? s.habits : [];
  s.logs = s.logs && typeof s.logs === 'object' ? s.logs : {};
  s.categories = (Array.isArray(s.categories) && s.categories.length) ? s.categories : defaultCategories();

  Object.keys(s.logs).forEach(habitId=>{
    const byDate = s.logs[habitId];
    if(!byDate || typeof byDate !== 'object'){ s.logs[habitId] = {}; return; }
    Object.keys(byDate).forEach(dateKey=>{
      const log = byDate[dateKey];
      if(!log || typeof log !== 'object'){ byDate[dateKey] = { status:'not_done', amount:0, entries:[] }; return; }
      if(log.amount === undefined && log.total !== undefined) log.amount = log.total;
      if(log.amount === undefined) log.amount = 0;
      if(!Array.isArray(log.entries)) log.entries = [];
    });
  });

  s.habits = s.habits.map((h,i) => migrateHabit(h, s.logs, i));
  return s;
}
function earliestLogDate(habitId, logs){
  const byDate = logs[habitId];
  if(!byDate) return null;
  const keys = Object.keys(byDate);
  if(!keys.length) return null;
  return keys.sort()[0];
}
function migrateHabit(h, logs, idx){
  h = Object.assign({}, h);
  if(!h.id) h.id = 'hb_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  if(!h.name) h.name = '未命名習慣';
  if(!h.type){ h.type = (h.unit || h.goal || (h.quickAdds && h.quickAdds.length)) ? 'quantity' : 'boolean'; }
  if(h.category === undefined) h.category = '';
  if(h.unit === undefined) h.unit = '';
  if(!Array.isArray(h.quickAdds)) h.quickAdds = [];
  if(!Array.isArray(h.executionDays)) h.executionDays = [];
  if(!h.startDate){ h.startDate = earliestLogDate(h.id, logs) || todayStr(); }
  if(!h.status) h.status = 'active';
  if(!Array.isArray(h.pausedRanges)) h.pausedRanges = [];
  if(!Array.isArray(h.configHistory) || h.configHistory.length===0){
    h.configHistory = [{ effectiveFrom: h.startDate, goal: (h.goal !== undefined ? h.goal : null) }];
  }
  delete h.goal;
  if(h.note === undefined) h.note = '';
  if(h.order === undefined) h.order = idx;
  return h;
}

/* ---------- Date helpers ---------- */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function fmt(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return fmt(new Date()); }
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function escapeHtml(str){ const div=document.createElement('div'); div.textContent = str==null?'':String(str); return div.innerHTML; }

/* ---------- Domain logic ---------- */
function isExecutionDay(habit, dateStr){
  if(!habit.executionDays || habit.executionDays.length === 0) return true;
  const dow = parseDate(dateStr).getDay();
  return habit.executionDays.includes(dow);
}
function isPausedOn(habit, dateStr){
  if(!habit.pausedRanges) return false;
  return habit.pausedRanges.some(r => dateStr >= r.from && dateStr <= r.to);
}
function effectiveGoal(habit, dateStr){
  if(!habit.configHistory || habit.configHistory.length === 0) return null;
  let g = null;
  for(const c of habit.configHistory){ if(c.effectiveFrom <= dateStr) g = c.goal; }
  return g;
}
function getLog(habitId, dateStr){ return (state.logs[habitId] && state.logs[habitId][dateStr]) || null; }
function dayStatus(habit, dateStr){
  if(isPausedOn(habit, dateStr)) return 'paused';
  if(!isExecutionDay(habit, dateStr)) return 'not_scheduled';
  const log = getLog(habit.id, dateStr);
  if(!log) return 'not_done';
  if(log.status === 'skipped') return 'skipped';
  if(habit.type === 'boolean' || habit.type === 'avoidance'){
    return log.status === 'done' ? 'done' : 'not_done';
  }
  const goal = effectiveGoal(habit, dateStr);
  const amt = log.amount || 0;
  if(goal){ return amt >= goal ? 'done' : (amt > 0 ? 'partial' : 'not_done'); }
  return amt > 0 ? 'done' : 'not_done';
}
function passiveStatus(s){ return s==='skipped' || s==='not_scheduled' || s==='paused'; }
function isScheduledThatDay(habit, dateStr){
  return dateStr >= habit.startDate && !isPausedOn(habit, dateStr) && isExecutionDay(habit, dateStr);
}
function calcLifetimeStats(habit){
  let done=0, total=0;
  let cursor = parseDate(habit.startDate);
  const today = new Date(); today.setHours(0,0,0,0);
  let guard = 0;
  while(cursor <= today && guard < 5000){
    const ds = fmt(cursor);
    const s = dayStatus(habit, ds);
    if(!passiveStatus(s)){ total++; if(s==='done') done++; }
    cursor.setDate(cursor.getDate()+1);
    guard++;
  }
  return { done, total };
}

const CHECK_ICON = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CHEVRON_ICON = `<svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const PLUS_ICON = `<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const TRASH_ICON = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9.5 7V4.8c0-.4.4-.8.9-.8h3.2c.5 0 .9.4.9.8V7m2.4 0-.8 12.2a2 2 0 01-2 1.8H8.8a2 2 0 01-2-1.8L6 7h12z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 10.8v6.4M14 10.8v6.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;

/* ================= TODAY ================= */
let expandedRows = new Set();

function renderToday(){
  const el = document.getElementById('tab-today');
  const t = todayStr();
  const active = state.habits.filter(h=>h.status==='active').sort((a,b)=>(a.order||0)-(b.order||0));
  const scheduledToday = active.filter(h=>!isPausedOn(h,t) && isExecutionDay(h,t));
  const doneCount = scheduledToday.filter(h=>dayStatus(h,t)==='done').length;
  const pct = scheduledToday.length ? Math.round(doneCount/scheduledToday.length*100) : 0;

  const now = new Date();
  const dateMeta = (now.getMonth()+1)+'月'+now.getDate()+'日 · 星期'+['日','一','二','三','四','五','六'][now.getDay()];
  let heroSub = '';
  if(scheduledToday.length){
    if(doneCount===0) heroSub = '尚未開始';
    else if(doneCount===scheduledToday.length) heroSub = '已完成';
    else heroSub = '進行中';
  }

  let listHtml = '';
  if(active.length === 0){
    listHtml = `
      <div class="empty-state">
        <div class="spot spot-lg"></div>
        <h3>還沒有任何習慣</h3>
        <p>新增一個開始吧。</p>
        <button onclick="document.querySelector('[data-tab=settings]').click()">＋ 新增習慣</button>
      </div>`;
  }else{
    listHtml = active.map(h=>renderTodayRow(h, t)).join('');
  }

  el.innerHTML = `
    <div class="hero">
      <div class="spot"></div>
      <div class="date-meta">${dateMeta}</div>
      ${scheduledToday.length ? `
      <div class="hero-label">今日完成</div>
      <div class="progress-line"><span class="frac">${doneCount}<span class="of"> / ${scheduledToday.length}</span></span></div>
      <div class="hero-sub">${heroSub}</div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>` : `<div class="hero-sub" style="margin-top:0;">今天沒有排定的習慣</div>`}
    </div>
    <div>${listHtml}</div>
  `;

  el.querySelectorAll('[data-row-toggle]').forEach(row=>{
    row.addEventListener('click', (e)=>{
      if(e.target.closest('[data-quick]') || e.target.closest('[data-manual-btn]') || e.target.closest('[data-expand]') || e.target.closest('input')) return;
      toggleBooleanLike(row.dataset.rowToggle);
    });
  });
  el.querySelectorAll('[data-quick]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); addAmount(btn.dataset.quick, parseFloat(btn.dataset.amt)); });
  });
  el.querySelectorAll('[data-manual-btn]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const input = document.getElementById('detail-manual-'+btn.dataset.manualBtn);
      const val = parseFloat(input.value);
      if(!isNaN(val) && val !== 0){ addAmount(btn.dataset.manualBtn, val); input.value=''; }
    });
  });
  el.querySelectorAll('[data-expand]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = btn.dataset.expand;
      if(expandedRows.has(id)) expandedRows.delete(id); else expandedRows.add(id);
      renderToday();
    });
  });
  el.querySelectorAll('[data-delentry]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!confirm('刪除這筆紀錄?')) return;
      deleteEntry(btn.dataset.delentry, parseInt(btn.dataset.idx));
    });
  });
}

function fmtTime(ts){ const d = new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }

function renderTodayRow(h, t){
  const status = dayStatus(h, t);
  const isDoneCls = (status === 'done') ? 'is-done' : '';
  const isDim = (status === 'not_scheduled' || status === 'paused');
  const expanded = expandedRows.has(h.id);
  const color = habitColorFor(h);

  if(isDim){
    return `
      <div class="habit-row dim">
        <span class="badge" style="background:var(--${color})"></span>
        <div class="info"><span class="name">${escapeHtml(h.name)}</span></div>
        <span class="dim-tag">${status==='paused' ? '暫停' : '非執行日'}</span>
      </div>`;
  }

  const log = getLog(h.id, t);
  const expandBtn = `<button class="icon-btn expand-btn ${expanded?'open':''}" data-expand="${h.id}" title="${expanded?'收合':'展開明細'}" aria-label="${expanded?'收合明細':'展開明細'}">${CHEVRON_ICON}</button>`;

  if(h.type === 'boolean' || h.type === 'avoidance'){
    const detail = expanded ? `
      <div class="row-detail">
        ${ (status==='done' && log && log.doneAt) ? `<div class="detail-muted">${fmtTime(log.doneAt)} 完成</div>` : `<div class="detail-muted">尚未紀錄</div>` }
      </div>` : '';
    const chkStyle = status==='done' ? `style="background:var(--${color});border-color:var(--${color})"` : '';
    return `
      <div class="habit-row ${isDoneCls}">
        <button class="checkbox ${status==='done'?'checked':''}" ${chkStyle} data-row-toggle="${h.id}" aria-label="${status==='done'?'標記為未完成':'標記為完成'}">${status==='done'?CHECK_ICON:''}</button>
        <div class="info" data-row-toggle="${h.id}">
          <span class="name">${escapeHtml(h.name)}</span>
        </div>
        ${expandBtn}
        ${detail}
      </div>`;
  }

  const amt = log ? (log.amount||0) : 0;
  const goal = effectiveGoal(h, t);
  const quickBtns = (h.quickAdds||[]).map(q=>`<button data-quick="${h.id}" data-amt="${q}">+${q}</button>`).join('');
  const entries = (log && log.entries) || [];
  const detail = expanded ? `
    <div class="row-detail">
      ${ entries.length ? entries.map((en,i)=>`<div class="detail-line"><span>${fmtTime(en.ts)}　${en.amt} ${escapeHtml(h.unit||'')}</span><button class="icon-btn del-entry" data-delentry="${h.id}" data-idx="${i}" title="刪除" aria-label="刪除這筆紀錄">${TRASH_ICON}</button></div>`).join('') : `<div class="detail-muted">尚未紀錄</div>` }
      <div class="add-entry-inline">
        <input type="number" placeholder="數量" id="detail-manual-${h.id}">
        <button data-manual-btn="${h.id}">${PLUS_ICON}新增</button>
      </div>
    </div>` : '';
  return `
    <div class="habit-row qty-row">
      <span class="badge" style="background:var(--${color})"></span>
      <div class="info">
        <span class="name">${escapeHtml(h.name)}</span>
        <span class="qty-inline"><span class="amt">${amt}</span>${goal? `<span class="goal">/${goal}</span>` : ''}<span class="unit">${escapeHtml(h.unit||'')}</span></span>
        ${quickBtns ? `<div class="quick-chips-inline">${quickBtns}</div>` : ''}
      </div>
      ${expandBtn}
      ${detail}
    </div>`;
}

async function toggleBooleanLike(habitId, dateStr, onDone){
  const t = dateStr || todayStr();
  if(!state.logs[habitId]) state.logs[habitId] = {};
  const cur = state.logs[habitId][t];
  const curStatus = cur ? cur.status : 'not_done';
  const newStatus = curStatus==='done' ? 'not_done' : 'done';
  state.logs[habitId][t] = { status: newStatus, amount:0, entries: [], doneAt: newStatus==='done' ? Date.now() : null };
  if(onDone) onDone(); else renderToday();
  await saveState();
}
async function addAmount(habitId, amount, dateStr, onDone){
  const t = dateStr || todayStr();
  if(!state.logs[habitId]) state.logs[habitId] = {};
  if(!state.logs[habitId][t]) state.logs[habitId][t] = { status:'not_done', amount:0, entries: [] };
  const log = state.logs[habitId][t];
  log.amount = (log.amount||0) + amount;
  log.entries = log.entries || [];
  log.entries.push({ amt: amount, ts: Date.now() });
  if(log.status === 'skipped') log.status = 'not_done';
  if(onDone) onDone(); else renderToday();
  await saveState();
}
async function deleteEntry(habitId, idx, dateStr, onDone){
  const t = dateStr || todayStr();
  const log = state.logs[habitId] && state.logs[habitId][t];
  if(!log || !log.entries || !log.entries[idx]) return;
  log.entries.splice(idx, 1);
  log.amount = log.entries.reduce((sum,e)=>sum+(e.amt||0), 0);
  if(onDone) onDone(); else renderToday();
  await saveState();
}

/* ================= RECORDS ================= */
function getWeekDates(offsetWeeks){
  const today = new Date();
  const dow = (today.getDay()+6)%7;
  const monday = new Date(today); monday.setDate(today.getDate()-dow+(offsetWeeks*7));
  const dates = []; for(let i=0;i<7;i++){ const d=new Date(monday); d.setDate(monday.getDate()+i); dates.push(d); }
  return dates;
}
function weekChip(status, color){
  if(status==='done') return `<div class="wk-chip-wrap"><span class="wk-chip" style="background:var(--${color})">✓</span></div>`;
  if(status==='skipped') return '<div class="wk-chip-wrap"><span class="wk-chip skip">–</span></div>';
  return '<div class="wk-chip-wrap"><span class="wk-chip miss"></span></div>';
}
function weekCompletion(h, weekDates){
  const today = new Date();
  let done=0, scheduled=0;
  weekDates.forEach(d=>{
    if(d>today) return;
    const ds = fmt(d);
    if(ds < h.startDate) return;
    const s = dayStatus(h, ds);
    if(passiveStatus(s)) return;
    scheduled++;
    if(s==='done') done++;
  });
  return { done, scheduled };
}

function renderRecords(){
  const el = document.getElementById('tab-records');
  if(state.habits.length === 0){
    el.innerHTML = `<div class="empty-state"><h3>還沒有紀錄</h3><p>新增第一個習慣後,這裡會慢慢累積。</p></div>`;
    return;
  }
  const visibleHabits = state.habits.filter(h=>h.status!=='deleted' && h.status!=='archived').sort((a,b)=>(a.order||0)-(b.order||0));
  const activeHabits = state.habits.filter(h=>h.status==='active').sort((a,b)=>(a.order||0)-(b.order||0));
  const thisWeek = getWeekDates(0);
  const lastWeek = getWeekDates(-1);
  const WD_LABELS = ['一','二','三','四','五','六','日'];
  const todayDs = todayStr();

  let weekDone=0, weekScheduled=0, lastWeekDone=0, lastWeekScheduled=0;
  const perHabitWeek = visibleHabits.map(h=>{
    const w = weekCompletion(h, thisWeek);
    weekDone += w.done; weekScheduled += w.scheduled;
    const lw = weekCompletion(h, lastWeek);
    lastWeekDone += lw.done; lastWeekScheduled += lw.scheduled;
    return { habit:h, ...w };
  });
  const weekPct = weekScheduled ? Math.round(weekDone/weekScheduled*100) : null;
  const lastWeekPct = lastWeekScheduled ? Math.round(lastWeekDone/lastWeekScheduled*100) : null;
  const delta = (weekPct!==null && lastWeekPct!==null) ? weekPct - lastWeekPct : null;

  const withData = perHabitWeek.filter(x=>x.scheduled>0);
  let best=null, worst=null;
  if(withData.length){
    best = withData.reduce((a,b)=> (b.done/b.scheduled) > (a.done/a.scheduled) ? b : a);
    worst = withData.reduce((a,b)=> (b.done/b.scheduled) < (a.done/a.scheduled) ? b : a);
    if(withData.length < 2 || best.habit.id === worst.habit.id) worst = null;
  }

  const cumHabits = state.habits.filter(h=>h.status==='active' || h.status==='paused').sort((a,b)=>(a.order||0)-(b.order||0));
  const cumData = cumHabits.map(h=>({ habit:h, done: calcLifetimeStats(h).done }));
  const maxCum = Math.max(1, ...cumData.map(c=>c.done));

  const headCols = thisWeek.map((d,i)=>{
    const isToday = fmt(d)===todayDs;
    return `<div class="wk-col-head ${isToday?'is-today':''}"><span class="wd">${WD_LABELS[i]}</span><span class="dd">${d.getDate()}</span></div>`;
  }).join('');
  const matrixRows = visibleHabits.map(h=>{
    const color = habitColorFor(h);
    const chips = thisWeek.map(d=>{
      const ds = fmt(d);
      if(d>new Date() || ds < h.startDate) return weekChip('na', color);
      return weekChip(dayStatus(h, ds), color);
    }).join('');
    return `<div class="week-table-row"><div class="wk-name">${escapeHtml(h.name)}</div><div class="wk-cols">${chips}</div></div>`;
  }).join('');

  el.innerHTML = `
    <div class="record-heading">紀錄</div>

    <div class="dash-card">
      <div class="spot"></div>
      <div class="cap">本週完成率</div>
      <div class="num">${weekPct===null?'—':weekPct+'%'}</div>
    </div>

    ${(best || worst) ? `
    <div class="stat-pair">
      ${best ? `<div class="stat-pill good"><div class="lbl">表現最好</div><div class="name">${escapeHtml(best.habit.name)}</div><div class="ratio">${best.done} / ${best.scheduled} 天</div></div>` : ''}
      ${worst ? `<div class="stat-pill warn"><div class="lbl">需要加強</div><div class="name">${escapeHtml(worst.habit.name)}</div><div class="ratio">${worst.done} / ${worst.scheduled} 天</div></div>` : ''}
    </div>` : ''}

    ${cumData.length ? `
    <div class="section-label">累積完成</div>
    ${cumData.map(c=>`<div class="cum-row"><div class="lbl">${escapeHtml(c.habit.name)}</div><div class="num">${c.done} 次</div></div>`).join('')}
    ` : ''}

    <div class="section-label">這一週的每一天</div>
    <div class="week-card">
      <div class="week-head-row"><div class="wk-name"></div><div class="wk-cols">${headCols}</div></div>
      ${matrixRows}
    </div>

    <div class="section-label">查看歷史</div>
    <div class="habit-chips" id="historyHabitChips"></div>
    <div class="cal-nav"><button id="calPrev">‹</button><div class="label" id="calLabel">—</div><button id="calNext">›</button></div>
    <div><div class="cal-weekdays"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div><div class="cal-days" id="calDays"></div></div>
    <div id="dayDetailHost"></div>
  `;

  renderHistoryHabitChips();
  renderCalendar();
  document.getElementById('calPrev').addEventListener('click', ()=>{ calCursor.setMonth(calCursor.getMonth()-1); selectedDayStr=null; renderCalendar(); document.getElementById('dayDetailHost').innerHTML=''; });
  document.getElementById('calNext').addEventListener('click', ()=>{ calCursor.setMonth(calCursor.getMonth()+1); selectedDayStr=null; renderCalendar(); document.getElementById('dayDetailHost').innerHTML=''; });
}

function renderCalendar(){
  const label = document.getElementById('calLabel');
  label.textContent = calCursor.getFullYear()+'年'+(calCursor.getMonth()+1)+'月';
  const daysEl = document.getElementById('calDays');
  const isAll = (historySelectedHabit === '' || historySelectedHabit === null);
  const habit = isAll ? null : state.habits.find(h=>h.id===historySelectedHabit);
  if(!isAll && !habit){ daysEl.innerHTML=''; return; }

  const year = calCursor.getFullYear(), month = calCursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay()+6)%7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const t = todayStr();
  const allHabits = state.habits.filter(h=>h.status!=='deleted').sort((a,b)=>(a.order||0)-(b.order||0));

  let html = '';
  for(let i=0;i<startOffset;i++) html += '<div class="cal-cell pad"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(year, month, d);
    const ds = fmt(dateObj);
    let cls = (ds===t) ? 'today' : '';
    if(ds===selectedDayStr) cls += ' selected';
    let dotHtml = '';
    if(ds <= t){
      if(isAll){
        const doneHabits = allHabits.filter(h => isScheduledThatDay(h, ds) && dayStatus(h, ds)==='done');
        const shown = doneHabits.slice(0,4);
        const more = doneHabits.length - shown.length;
        dotHtml = shown.map(h=>`<span class="cal-dot mini" style="background:var(--${habitColorFor(h)})"></span>`).join('') + (more>0?`<span class="cal-more">+${more}</span>`:'');
      }else{
        if(ds >= habit.startDate && dayStatus(habit, ds)==='done'){
          dotHtml = `<span class="cal-dot" style="background:var(--${habitColorFor(habit)})"></span>`;
        }
      }
    }
    html += `<div class="cal-cell ${cls}" data-day="${ds}"><span class="cal-d">${d}</span><span class="cal-dot-holder">${dotHtml}</span></div>`;
  }
  daysEl.innerHTML = html;
  daysEl.querySelectorAll('.cal-cell[data-day]').forEach(cell=>{
    cell.addEventListener('click', ()=> showDayDetail(cell.dataset.day));
  });
}

function showDayDetail(ds){
  selectedDayStr = ds;
  renderCalendar();
  const host = document.getElementById('dayDetailHost');
  const d = parseDate(ds);
  const isAll = (historySelectedHabit === '' || historySelectedHabit === null);

  if(isAll){
    const allHabits = state.habits.filter(h=>h.status!=='deleted' && isScheduledThatDay(h, ds)).sort((a,b)=>(a.order||0)-(b.order||0));
    if(allHabits.length === 0){
      host.innerHTML = `<div class="day-detail-panel"><div class="day-detail-date">${d.getMonth()+1} 月 ${d.getDate()} 日</div><div class="day-detail-empty">這天沒有排定的習慣</div></div>`;
      return;
    }
    const lines = allHabits.map(h=>{
      const s = dayStatus(h, ds);
      const color = habitColorFor(h);
      let valueTxt = escapeHtml(h.name);
      if(h.type!=='boolean' && h.type!=='avoidance' && s!=='skipped'){
        const log = getLog(h.id, ds);
        const amt = log ? (log.amount||0) : 0;
        const goal = effectiveGoal(h, ds);
        valueTxt += ` <span style="color:var(--ink-muted);font-weight:400;">${amt}${goal? '/'+goal : ''} ${escapeHtml(h.unit||'')}</span>`;
      }
      const mark = s==='done' ? '✓' : (s==='skipped' ? '–' : '○');
      return `<div class="day-detail-list-line ${s!=='done'?'not-done':''}"><span class="dd-dot" style="background:var(--${color})"></span><span class="mark">${mark}</span><span>${valueTxt}</span></div>`;
    }).join('');
    host.innerHTML = `<div class="day-detail-panel"><div class="day-detail-date">${d.getMonth()+1} 月 ${d.getDate()} 日</div>${lines}</div>`;
    return;
  }

  const habit = state.habits.find(h=>h.id===historySelectedHabit);
  if(!habit) return;
  const color = habitColorFor(habit);

  if(!isScheduledThatDay(habit, ds) || ds < habit.startDate){
    host.innerHTML = `<div class="day-detail-panel"><div class="day-detail-date">${d.getMonth()+1} 月 ${d.getDate()} 日</div><div class="day-detail-habit"><span class="dd-dot" style="background:var(--${color})"></span>${escapeHtml(habit.name)}</div><div class="day-detail-empty">這天沒有排定</div></div>`;
    return;
  }
  const s = dayStatus(habit, ds);
  let statusTxt;
  if(s==='skipped') statusTxt = '已跳過';
  else if(habit.type==='boolean' || habit.type==='avoidance') statusTxt = s==='done' ? '✓ 完成' : '未完成';
  else{
    const log = getLog(habit.id, ds);
    const amt = log ? (log.amount||0) : 0;
    const goal = effectiveGoal(habit, ds);
    statusTxt = amt + (goal? ' / '+goal : '') + ' ' + (habit.unit||'') + (s==='done'?' ✓':'');
  }

  let editHtml = '';
  if(habit.type==='boolean' || habit.type==='avoidance'){
    if(s!=='skipped'){
      editHtml = `<button class="icon-text-btn" data-editday-toggle="${habit.id}" data-editday-date="${ds}">${s==='done'?CHECK_ICON:PLUS_ICON}${s==='done'?'取消完成':'標記完成'}</button>`;
    }
  }else{
    const log = getLog(habit.id, ds);
    const entries = (log && log.entries) || [];
    const entriesHtml = entries.length ? entries.map((en,i)=>`<div class="day-detail-entry"><span>${fmtTime(en.ts)}　${en.amt} ${escapeHtml(habit.unit||'')}</span><button class="icon-btn del-entry" data-editday-del="${habit.id}" data-editday-date="${ds}" data-idx="${i}" title="刪除" aria-label="刪除這筆紀錄">${TRASH_ICON}</button></div>`).join('') : '';
    editHtml = `
      ${entriesHtml}
      <div class="add-entry-inline" style="margin-top:10px;">
        <input type="number" placeholder="數量" id="editday-manual-${habit.id}-${ds}">
        <button data-editday-add="${habit.id}" data-editday-date="${ds}">${PLUS_ICON}新增</button>
      </div>`;
  }

  host.innerHTML = `
    <div class="day-detail-panel">
      <div class="day-detail-date">${d.getMonth()+1} 月 ${d.getDate()} 日</div>
      <div class="day-detail-habit"><span class="dd-dot" style="background:var(--${color})"></span>${escapeHtml(habit.name)}</div>
      <div class="day-detail-status">${statusTxt}</div>
      ${editHtml}
    </div>`;

  host.querySelectorAll('[data-editday-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=> toggleBooleanLike(btn.dataset.editdayToggle, btn.dataset.editdayDate, ()=>{ renderRecords(); showDayDetail(btn.dataset.editdayDate); }));
  });
  host.querySelectorAll('[data-editday-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!confirm('刪除這筆紀錄?')) return;
      deleteEntry(btn.dataset.editdayDel, parseInt(btn.dataset.idx), btn.dataset.editdayDate, ()=>{ renderRecords(); showDayDetail(btn.dataset.editdayDate); });
    });
  });
  host.querySelectorAll('[data-editday-add]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const input = document.getElementById('editday-manual-'+btn.dataset.editdayAdd+'-'+btn.dataset.editdayDate);
      const val = parseFloat(input.value);
      if(!isNaN(val) && val !== 0){ addAmount(btn.dataset.editdayAdd, val, btn.dataset.editdayDate, ()=>{ renderRecords(); showDayDetail(btn.dataset.editdayDate); }); }
    });
  });
}

function habitManageRowHtml(h, isFirst, isLast){
  const goal = h.configHistory && h.configHistory.length ? h.configHistory[h.configHistory.length-1].goal : null;
  const days = (!h.executionDays || h.executionDays.length===0) ? '每天' : WEEKDAY_CHECKS.filter(w=>h.executionDays.includes(w.val)).map(w=>w.label).join('');

  if(goal !== null && goal !== undefined) metaBits.push(goal + (h.unit ? ' '+h.unit : ''));
  else if(h.unit) metaBits.push(h.unit);

    actions = `<button class="muted" data-pause="${h.id}">暫停</button><button data-edit="${h.id}">編輯</button><button class="muted" data-archive="${h.id}">封存</button><button class="danger" data-softdelete="${h.id}">刪除</button>`;

  }else{
    actions = `<button data-resume="${h.id}">取消封存</button><button class="danger" data-softdelete="${h.id}">刪除</button>`;

function moveHabitOrder(habitId, direction){
  const h = state.habits.find(x=>x.id===habitId);
  if(!h) return;
  const group = state.habits.filter(x=>x.status===h.status).sort((a,b)=>(a.order||0)-(b.order||0));
  const idx = group.findIndex(x=>x.id===habitId);
  const swapIdx = idx + direction;
  if(swapIdx < 0 || swapIdx >= group.length) return;
  const other = group[swapIdx];
  const tmp = h.order; h.order = other.order; other.order = tmp;
}

function bindHabitManageActions(el){
  el.querySelectorAll('[data-orderup]').forEach(b=>b.addEventListener('click', async ()=>{
    moveHabitOrder(b.dataset.orderup, -1);
    renderAll(); await saveState();
  }));
  el.querySelectorAll('[data-orderdown]').forEach(b=>b.addEventListener('click', async ()=>{
    moveHabitOrder(b.dataset.orderdown, 1);
    renderAll(); await saveState();
  }));
  el.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{
    const h = state.habits.find(x=>x.id===b.dataset.edit);
    if(h) showHabitForm(h);
  }));
  el.querySelectorAll('[data-pause]').forEach(b=>b.addEventListener('click', async ()=>{
    const h = state.habits.find(x=>x.id===b.dataset.pause);
    if(!h) return;
    const from = todayStr();
    const to = prompt('暫停到哪一天?(YYYY-MM-DD)', addDaysStr(from,7));
    if(!to) return;
    h.status = 'paused'; h.pausedRanges = h.pausedRanges || [];
    h.pausedRanges.push({ from, to });
    renderAll(); await saveState();
  }));
  el.querySelectorAll('[data-resume]').forEach(b=>b.addEventListener('click', async ()=>{
    const h = state.habits.find(x=>x.id===b.dataset.resume);
    if(!h) return;
    h.status = 'active';
    renderAll(); await saveState();
  }));
  el.querySelectorAll('[data-archive]').forEach(b=>b.addEventListener('click', async ()=>{
    const h = state.habits.find(x=>x.id===b.dataset.archive);
    if(!h) return;
    if(!confirm('封存「'+h.name+'」?紀錄會保留,可以取消封存。')) return;
    h.status = 'archived';
    renderAll(); await saveState();
  }));
  el.querySelectorAll('[data-softdelete]').forEach(b=>b.addEventListener('click', async ()=>{
    const h = state.habits.find(x=>x.id===b.dataset.softdelete);
    if(!h) return;
    if(!confirm(`刪除「${h.name}」?刪除後將不再出現在習慣列表,歷史紀錄會保留。`)) return;
    h.status = 'deleted';
    if(historySelectedHabit===h.id) historySelectedHabit = '';
    renderAll(); await saveState();
  }));
}

          ${TYPE_LIST.map(t=>`
            <label class="type-pill ${t.key===defaultType?'tp-checked':''}">
              <input type="radio" name="fType" value="${t.key}" ${t.key===defaultType?'checked':''}>
              <span>${escapeHtml(t.label)}</span>
            </label>`).join('')}
        </div>
        <div class="hint" id="typeHint"></div>
      </div>
      <div id="quantFields">
        <div class="field-row">
          <div class="field"><label>單位</label><input id="fUnit" value="${habit&&habit.unit?escapeHtml(habit.unit):''}" placeholder="例如:ml、分鐘"></div>
          <div class="field"><label>目標(可留空)</label><input id="fGoal" type="number" value="${goal??''}" placeholder="例如:2000"></div>
        </div>
        <div class="field"><label>快速加量</label><input id="fQuick" value="${habit&&habit.quickAdds?habit.quickAdds.join(','):''}" placeholder="例如:100,250,500"><div class="hint">逗號分開,最多4個</div></div>
      </div>
      <details class="adv">
        <summary>進階設定</summary>
        <div class="adv-body">
          <div class="field"><label>執行日</label>
            <div class="daypick" id="dayPick">${WEEKDAY_CHECKS.map(w=>`<label class="${habit&&habit.executionDays&&habit.executionDays.includes(w.val)?'dc-on':''}"><input type="checkbox" class="dayChk" value="${w.val}" ${habit&&habit.executionDays&&habit.executionDays.includes(w.val)?'checked':''}><span>${w.label}</span></label>`).join('')}</div>
            <div class="hint">不選 = 每天</div>
          </div>
          <div class="field"><label>開始日期</label><input id="fStart" type="date" value="${habit?habit.startDate:todayStr()}"></div>
          <div class="field"><label>備註</label><textarea id="fNote">${habit&&habit.note?escapeHtml(habit.note):''}</textarea></div>
        </div>
      </details>
      <div class="form-actions">
        <button class="primary" id="saveHabitBtn">${habit?'儲存':'新增'}</button>
        <button class="ghost" id="cancelFormBtn">取消</button>
      </div>
    </div>`;

  function syncType(){
    const t = document.querySelector('input[name="fType"]:checked').value;
    document.getElementById('quantFields').style.display = (t==='boolean'||t==='avoidance') ? 'none' : 'block';
    document.getElementById('typeHint').textContent = (TYPE_LIST.find(x=>x.key===t)||{}).desc || '';
  }
  document.querySelectorAll('input[name="fType"]').forEach(r=>r.addEventListener('change', (e)=>{
    document.querySelectorAll('#typePicker .type-pill').forEach(opt=>opt.classList.remove('tp-checked'));
    e.target.closest('.type-pill').classList.add('tp-checked');
    syncType();
  }));
  syncType();

  document.querySelectorAll('#dayPick .dayChk').forEach(chk=>chk.addEventListener('change', (e)=>{
    e.target.closest('label').classList.toggle('dc-on', e.target.checked);
  }));

  document.getElementById('cancelFormBtn').addEventListener('click', ()=>{ editingHabitId=null; host.innerHTML=''; });
  document.getElementById('saveHabitBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('fName').value.trim();
    if(!name){ document.getElementById('fName').focus(); return; }
    const type = document.querySelector('input[name="fType"]:checked').value;
    const unit = document.getElementById('fUnit').value.trim();
    const goalRaw = document.getElementById('fGoal').value.trim();
    const goalVal = goalRaw ? parseFloat(goalRaw) : null;
    const quickRaw = document.getElementById('fQuick').value.trim();
    const quickAdds = quickRaw ? quickRaw.split(',').map(s=>parseFloat(s.trim())).filter(n=>!isNaN(n)).slice(0,4) : [];
    const executionDays = Array.from(document.querySelectorAll('.dayChk:checked')).map(c=>parseInt(c.value));
    const startDate = document.getElementById('fStart').value || todayStr();
    const note = document.getElementById('fNote').value.trim();

    if(editingHabitId){
      const h = state.habits.find(x=>x.id===editingHabitId);
      h.name = name; h.type = type; h.unit = unit;
      h.executionDays = executionDays; h.startDate = startDate; h.note = note;
      if(quickAdds.length) h.quickAdds = quickAdds;
      h.configHistory = h.configHistory || [];
      const lastGoal = h.configHistory.length ? h.configHistory[h.configHistory.length-1].goal : null;
      if(lastGoal !== goalVal){ h.configHistory.push({ effectiveFrom: todayStr(), goal: goalVal }); }
    }else{
      state.habits.push({
        id: 'hb_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
        name, type, unit, quickAdds, executionDays, startDate, note,
        status: 'active', pausedRanges: [], order: Date.now(),
        configHistory: [{ effectiveFrom: startDate, goal: goalVal }]
      });
    }
    editingHabitId = null; host.innerHTML = '';
    renderAll(); await saveState();
  });
}

function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'habit-tracker_'+todayStr()+'.json';
  a.click();
  URL.revokeObjectURL(url);
}

/* ================= Render all ================= */
function renderAll(){
  renderToday();
  if(document.getElementById('tab-records').classList.contains('active')) renderRecords();
  if(document.getElementById('tab-settings').classList.contains('active')) renderSettings();
}
</script>
</body>
</html>
