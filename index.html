<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>習慣花園</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

  :root{
    --paper: #F6F1E4;
    --surface: #FFFDF7;
    --ink: #2B3328;
    --ink-muted: #79725F;
    --moss: #3F6B4A;
    --moss-dim: #E4EBE3;
    --sage: #93AD82;
    --sage-dim: #EEF2E9;
    --bloom: #C97B84;
    --bloom-dim: #F7E9EB;
    --soil: #A9744F;
    --border: #E6DFCB;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 16.5px;
    line-height: 1.5;
    padding-bottom: 60px;
    -webkit-font-smoothing: antialiased;
  }
  .serif{ font-family:'Fraunces','Noto Sans TC',serif; }
  .meta{ font-size:11.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-muted); font-weight:600; }
  a{ color:inherit; }
  button{ font-family:inherit; }

  /* ---------- Login ---------- */
  #loginScreen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 24px;
    text-align:center;
  }
  #loginScreen .logo-mark{ width:56px; height:56px; color: var(--moss); margin-bottom:14px; }
  #loginScreen h1{ font-family:'Fraunces',serif; font-size:32px; font-weight:600; margin: 0 0 8px; }
  #loginScreen p{ color: var(--ink-muted); margin: 0 0 30px; font-size:15.5px; max-width:280px; line-height:1.6; }
  #googleBtn{
    display:flex; align-items:center; gap:10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 13px 24px;
    font-size: 15px; font-weight:600; color: var(--ink);
    cursor:pointer;
  }
  #googleBtn svg{ width:19px; height:19px; }
  #loginStatus{ margin-top:14px; font-size:13px; color: var(--ink-muted); min-height: 18px; }

  /* ---------- Shell ---------- */
  #app{ max-width: 620px; margin: 0 auto; padding: 22px 18px 0; }
  #app[hidden]{ display:none; }

  header.top{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 20px; }
  header.top .brand{ display:flex; align-items:center; gap:9px; }
  header.top .brand .mark{ width:24px; height:24px; color: var(--moss); }
  header.top .brand h1{ font-family:'Fraunces',serif; font-size:19px; font-weight:600; margin:0; }
  header.top .user{ display:flex; align-items:center; gap:9px; }
  header.top .user img{ width:28px; height:28px; border-radius:50%; }
  header.top .user button{ background:none; border:none; color: var(--ink-muted); font-size:12.5px; cursor:pointer; text-decoration:underline; padding:0; }

  nav.tabs{
    display:flex; gap: 22px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 22px;
    overflow-x:auto;
  }
  nav.tabs button{
    border:none; background:transparent;
    padding: 0 2px 11px;
    font-size: 14.5px; font-weight:600; color: var(--ink-muted);
    cursor:pointer; white-space:nowrap;
    border-bottom: 2px solid transparent;
    margin-bottom:-1px;
  }
  nav.tabs button.active{ color: var(--ink); border-bottom-color: var(--moss); }

  section.tab{ display:none; }
  section.tab.active{ display:block; animation: fade .18s ease; }
  @keyframes fade{ from{opacity:0;} to{opacity:1;} }

  /* ---------- Hero ---------- */
  .hero{ margin-bottom: 24px; position:relative; }
  .hero .date-row{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
  .hero .date-meta{ font-size:12px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-muted); font-weight:600; }
  .hero .greeting{ font-family:'Fraunces',serif; font-style:italic; font-size:22px; font-weight:500; margin: 2px 0 14px; max-width: 80%; }
  .hero .plant-deco{ position:absolute; top:-6px; right:0; width:46px; height:46px; color: var(--sage); opacity:0.85; }
  .hero .progress-line{ display:flex; align-items:baseline; gap:10px; }
  .hero .progress-line .frac{ font-family:'Fraunces',serif; font-weight:600; font-size:30px; color: var(--moss); }
  .hero .progress-line .pct{ font-size:13.5px; color: var(--ink-muted); }
  .hero .track{ height:4px; background: var(--border); border-radius:2px; margin-top:10px; overflow:hidden; }
  .hero .track .fill{ height:100%; background: var(--moss); border-radius:2px; transition: width .3s ease; }

  /* ---------- Habit row (today) ---------- */
  .habit-row{
    display:flex; align-items:center; gap:12px;
    padding: 13px 4px;
    border-bottom: 1px solid var(--border);
    cursor:pointer;
    background:none;
    width:100%;
    text-align:left;
  }
  .habit-row:last-child{ border-bottom:none; }
  .habit-row.dim{ opacity:0.5; cursor:default; }
  .habit-row .plant-icon{ width:26px; height:26px; flex-shrink:0; color: var(--sage); }
  .habit-row.is-done .plant-icon{ color: var(--moss); }
  .habit-row .info{ flex:1; min-width:0; }
  .habit-row .name-line{ display:flex; align-items:baseline; gap:8px; }
  .habit-row .name{ font-weight:600; font-size:15.5px; }
  .habit-row.is-done .name{ color: var(--moss); }
  .habit-row .streak-txt{ font-size:12px; color: var(--ink-muted); flex-shrink:0; margin-left:auto; }
  .habit-row .sub-line{ font-size:13px; color: var(--ink-muted); margin-top:2px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .habit-row .sub-line .amt{ font-family:'Fraunces',serif; font-weight:600; color: var(--ink); }
  .habit-row .quick-chips{ display:flex; gap:6px; margin-top:6px; }
  .habit-row .quick-chips button{
    background: var(--sage-dim); color:#3d5c33; border:none; border-radius:6px;
    padding:5px 10px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .habit-row .check-mark{ width:22px; height:22px; flex-shrink:0; color: var(--border); }
  .habit-row.is-done .check-mark{ color: var(--moss); }
  .habit-row .skip-link{ font-size:11.5px; color: var(--ink-muted); text-decoration:underline; background:none; border:none; cursor:pointer; padding:0; flex-shrink:0; }
  .habit-row.is-skipped .name{ text-decoration: line-through; color: var(--ink-muted); }

  .empty-state{ text-align:center; padding: 60px 20px; color: var(--ink-muted); }
  .empty-state .logo-mark{ width:44px; height:44px; color: var(--sage); margin-bottom:14px; }
  .empty-state h3{ font-family:'Fraunces',serif; font-size:19px; color: var(--ink); font-weight:600; margin:0 0 6px; }
  .empty-state p{ font-size:14.5px; margin:0 0 18px; }
  .empty-state button{ background: var(--moss); color:#fff; border:none; border-radius:8px; padding:11px 22px; font-weight:700; font-size:14px; cursor:pointer; }

  /* ---------- My Habits ---------- */
  .section-label{ font-size:12px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-muted); font-weight:700; margin: 22px 0 10px; }
  .section-label:first-child{ margin-top:0; }

  .habit-manage-row{ padding: 12px 2px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .habit-manage-row .info b.serif{ font-size:16px; font-weight:600; }
  .habit-manage-row .info .meta-line{ font-size:12.5px; color: var(--ink-muted); margin-top:3px; }
  .habit-manage-row .link-actions{ display:flex; gap:12px; flex-shrink:0; padding-top:2px; }
  .habit-manage-row .link-actions button{ background:none; border:none; font-size:12.5px; color: var(--moss); text-decoration:underline; cursor:pointer; padding:0; }
  .habit-manage-row .link-actions button.muted{ color: var(--ink-muted); }
  .habit-manage-row .link-actions button.danger{ color: var(--bloom); }

  .add-btn-row{ margin-bottom: 6px; }
  .add-btn-row button{
    background: var(--moss); color:#fff; border:none; border-radius:8px;
    padding: 11px 18px; font-weight:700; font-size:14.5px; cursor:pointer;
  }

  /* ---------- Form (modal-ish inline) ---------- */
  .form-panel{
    background: var(--surface); border:1px solid var(--border); border-radius: 10px;
    padding: 18px; margin-bottom: 20px;
  }
  .form-panel h3{ font-family:'Fraunces',serif; font-size:17px; font-weight:600; margin:0 0 14px; }
  .field{ margin-bottom: 13px; }
  .field label{ display:block; font-size:12.5px; color: var(--ink-muted); margin-bottom:5px; font-weight:600; }
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--border); border-radius:8px;
    padding: 10px 11px; font-size:15px; outline:none; font-family:'Noto Sans TC',sans-serif;
    background: var(--paper);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--moss); }
  .field textarea{ resize:vertical; min-height:56px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .hint{ font-size:12px; color:#a39c86; margin-top:4px; }

  .daypick{ display:flex; gap:6px; }
  .daypick label{ flex:1; text-align:center; }
  .daypick input{ display:none; }
  .daypick span{
    display:block; padding:8px 0; border:1px solid var(--border); border-radius:6px;
    font-size:12.5px; color: var(--ink-muted); cursor:pointer;
  }
  .daypick input:checked + span{ background: var(--moss-dim); border-color: var(--moss); color: var(--moss); font-weight:700; }

  details.adv{ margin-bottom: 14px; }
  details.adv summary{ font-size:13px; color: var(--moss); cursor:pointer; font-weight:600; padding:6px 0; }
  details.adv .adv-body{ padding-top:8px; }

  .form-actions{ display:flex; gap:10px; margin-top:6px; }
  .form-actions .primary{ flex:1; background: var(--moss); color:#fff; border:none; border-radius:8px; padding:12px; font-weight:700; font-size:15px; cursor:pointer; }
  .form-actions .ghost{ background:none; border:none; color: var(--ink-muted); font-size:13.5px; text-decoration:underline; cursor:pointer; }

  /* ---------- Records ---------- */
  .week-dots-block{ margin-bottom: 22px; }
  .week-dots-row{ display:flex; align-items:center; justify-content:space-between; padding: 10px 2px; border-bottom:1px solid var(--border); }
  .week-dots-row .name{ font-size:14.5px; font-weight:600; flex-shrink:0; width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dots{ display:flex; gap:5px; }
  .dot{ width:11px; height:11px; border-radius:50%; border:1.4px solid var(--sage); background:transparent; flex-shrink:0; }
  .dot.done{ background: var(--moss); border-color: var(--moss); }
  .dot.skipped{ background: var(--border); border-color: var(--border); }
  .dot.faint{ border-color: var(--border); }
  .week-dots-row .summary-txt{ font-size:12px; color: var(--ink-muted); flex-shrink:0; width:70px; text-align:right; }

  .habit-chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:16px; }
  .habit-chips button{
    flex-shrink:0; border: 1px solid var(--border); background: var(--surface);
    padding: 7px 14px; border-radius: 999px; font-size: 13.5px; font-weight:600; color: var(--ink-muted); cursor:pointer;
  }
  .habit-chips button.active{ background: var(--moss); border-color: var(--moss); color:#fff; }

  .record-narrative{ font-family:'Fraunces',serif; font-size:18px; font-style:italic; margin-bottom:16px; line-height:1.5; }
  .record-narrative b{ font-style:normal; color: var(--moss); }

  .dots-30{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom: 24px; }
  .dots-30 .dot{ width:14px; height:14px; }

  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 12px; }
  .cal-nav button{ background:none; border:none; color: var(--moss); font-size:13.5px; font-weight:600; cursor:pointer; text-decoration:underline; }
  .cal-nav .label.serif{ font-size:16px; font-weight:600; }
  .cal-weekdays{ display:grid; grid-template-columns: repeat(7,1fr); margin-bottom:6px; }
  .cal-weekdays div{ text-align:center; font-size:11.5px; color: var(--ink-muted); font-weight:600; }
  .cal-days{ display:grid; grid-template-columns: repeat(7,1fr); gap:3px; }
  .cal-cell{ aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12.5px; color: var(--ink-muted); border:1px solid var(--border); border-radius:6px; }
  .cal-cell.pad{ border-color:transparent; }
  .cal-cell.done{ border-color: var(--moss); color: var(--moss); font-weight:700; }
  .cal-cell.partial{ border-color: var(--sage); color:#4b6a3f; }
  .cal-cell.skipped{ background: var(--border); border-color: var(--border); }
  .cal-cell.today{ box-shadow: inset 0 0 0 1.5px var(--bloom); }

  /* ---------- Settings ---------- */
  .settings-row{ padding: 14px 2px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .settings-row .lbl{ font-size:15px; font-weight:600; }
  .settings-row .desc{ font-size:12.5px; color: var(--ink-muted); margin-top:2px; }
  .settings-row button{ background: var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-size:13.5px; font-weight:600; cursor:pointer; color: var(--ink); }

  @media (max-width:420px){
    .hero .greeting{ font-size:19px; }
    .hero .progress-line .frac{ font-size:26px; }
    nav.tabs{ gap:16px; }
  }
</style>
</head>
<body>

<div id="loginScreen">
  <svg class="logo-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M11 28c-1-6 0-11 3-14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M9 27c9 3 15-1 16-9-8-2-14 2-16 9z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 24c1-6 4-10 9-12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
    <path d="M23 12c-8 1-10 6-9 12 7-1 10-6 9-12z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  </svg>
  <h1>習慣花園</h1>
  <p>登入後,你的紀錄會保存在雲端,換裝置也看得到。</p>
  <button id="googleBtn">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.4 0-13.8 4.1-17.1 10.1z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4c-2 1.4-4.7 2.3-7.7 2.3-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.9 39.7 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.6 5.4C41.8 35.7 44 30.3 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
    使用 Google 登入
  </button>
  <div id="loginStatus"></div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M11 28c-1-6 0-11 3-14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M9 27c9 3 15-1 16-9-8-2-14 2-16 9z" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>習慣花園</h1>
    </div>
    <div class="user">
      <img id="userAvatar" src="" alt="">
      <button id="signOutBtn">登出</button>
    </div>
  </header>

  <nav class="tabs">
    <button data-tab="today" class="active">今日</button>
    <button data-tab="habits">我的習慣</button>
    <button data-tab="records">紀錄</button>
    <button data-tab="settings">設定</button>
  </nav>

  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-habits"></section>
  <section class="tab" id="tab-records"></section>

  <section class="tab" id="tab-settings">
    <div class="settings-row">
      <div>
        <div class="lbl">匯出資料</div>
        <div class="desc">把所有習慣與紀錄匯出成 JSON 檔,資料永遠是你的。</div>
      </div>
      <button id="exportBtn">匯出 JSON</button>
    </div>
    <div class="settings-row">
      <div>
        <div class="lbl">登出帳號</div>
        <div class="desc">登出後需要重新用 Google 登入。</div>
      </div>
      <button id="signOutBtn2">登出</button>
    </div>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBfahNxiikOm_MlOr_A90BquRwFRM35Uho",
  authDomain: "habit-tracker202608.firebaseapp.com",
  projectId: "habit-tracker202608",
  storageBucket: "habit-tracker202608.firebasestorage.app",
  messagingSenderId: "944347991980",
  appId: "1:944347991980:web:9b0007453ea9f8cba47409"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let uid = null;
let unsub = null;
let state = { habits: [], logs: {} };

let editingHabitId = null;
let recordsSelectedHabit = null;
let calCursor = new Date();

const TYPE_LABELS = { boolean:'完成型', quantity:'數量型', duration:'時間型', count:'次數型', avoidance:'避免型' };
const CATEGORY_LABELS = { body:'身體', study:'學習', life:'生活', work:'工作', relationship:'關係', other:'其他' };
const WEEKDAY_CHECKS = [ {label:'一', val:1}, {label:'二', val:2}, {label:'三', val:3}, {label:'四', val:4}, {label:'五', val:5}, {label:'六', val:6}, {label:'日', val:0} ];

/* ---------- Auth ---------- */
document.getElementById('googleBtn').addEventListener('click', async () => {
  document.getElementById('loginStatus').textContent = '登入中…';
  try{ await signInWithPopup(auth, provider); }
  catch(e){ document.getElementById('loginStatus').textContent = '登入失敗,請再試一次(' + e.code + ')'; }
});
document.getElementById('signOutBtn').addEventListener('click', () => signOut(auth));
document.getElementById('signOutBtn2').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  if(user){
    uid = user.uid;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').hidden = false;
    document.getElementById('userAvatar').src = user.photoURL || '';
    listenToData();
  }else{
    uid = null;
    if(unsub) unsub();
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('app').hidden = true;
  }
});

function listenToData(){
  const ref = doc(db, 'users', uid);
  unsub = onSnapshot(ref, (snap) => {
    if(snap.exists()){
      state = snap.data();
      if(!state.habits) state.habits = [];
      if(!state.logs) state.logs = {};
    }else{
      state = { habits: [], logs: {} };
      setDoc(ref, state);
    }
    if(!recordsSelectedHabit && state.habits.length) recordsSelectedHabit = state.habits[0].id;
    renderAll();
  });
}
async function saveState(){ await setDoc(doc(db, 'users', uid), state); }

/* ---------- Date helpers ---------- */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function fmt(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return fmt(new Date()); }
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function escapeHtml(str){ const div=document.createElement('div'); div.textContent = str==null?'':String(str); return div.innerHTML; }

/* ---------- Domain logic ---------- */
function isExecutionDay(habit, dateStr){
  if(!habit.executionDays || habit.executionDays.length === 0) return true;
  const dow = parseDate(dateStr).getDay();
  return habit.executionDays.includes(dow);
}
function isPausedOn(habit, dateStr){
  if(!habit.pausedRanges) return false;
  return habit.pausedRanges.some(r => dateStr >= r.from && dateStr <= r.to);
}
function effectiveGoal(habit, dateStr){
  if(!habit.configHistory || habit.configHistory.length === 0) return habit.goal ?? null;
  let g = null;
  for(const c of habit.configHistory){
    if(c.effectiveFrom <= dateStr) g = c.goal;
  }
  return g;
}
function getLog(habitId, dateStr){
  return (state.logs[habitId] && state.logs[habitId][dateStr]) || null;
}
function dayStatus(habit, dateStr){
  if(isPausedOn(habit, dateStr)) return 'paused';
  if(!isExecutionDay(habit, dateStr)) return 'not_scheduled';
  const log = getLog(habit.id, dateStr);
  if(!log) return 'not_done';
  if(log.status === 'skipped') return 'skipped';
  if(habit.type === 'boolean' || habit.type === 'avoidance'){
    return log.status === 'done' ? 'done' : 'not_done';
  }
  const goal = effectiveGoal(habit, dateStr);
  const amt = log.amount || 0;
  if(goal){ return amt >= goal ? 'done' : (amt > 0 ? 'partial' : 'not_done'); }
  return amt > 0 ? 'done' : 'not_done';
}
function passiveStatus(s){ return s==='skipped' || s==='not_scheduled' || s==='paused'; }

function calcStreak(habit){
  let streak = 0;
  let cursor = new Date();
  let cursorStr = fmt(cursor);
  if(dayStatus(habit, cursorStr) === 'not_done'){
    cursor.setDate(cursor.getDate()-1);
  }
  while(true){
    cursorStr = fmt(cursor);
    if(cursorStr < habit.startDate) break;
    const s = dayStatus(habit, cursorStr);
    if(s === 'done'){ streak++; cursor.setDate(cursor.getDate()-1); continue; }
    if(passiveStatus(s)){ cursor.setDate(cursor.getDate()-1); continue; }
    break;
  }
  return streak;
}
function calcAccumulation(habit, days){
  let done=0, total=0;
  const today = new Date();
  for(let i=0;i<days;i++){
    const d = new Date(today); d.setDate(today.getDate()-i);
    const ds = fmt(d);
    if(ds < habit.startDate) continue;
    const s = dayStatus(habit, ds);
    if(passiveStatus(s)) continue;
    total++;
    if(s==='done') done++;
  }
  return { done, total, pct: total ? Math.round(done/total*100) : 0 };
}
function streakStage(streak){
  if(streak >= 14) return 'flower';
  if(streak >= 7) return 'leafy';
  if(streak >= 3) return 'small';
  if(streak >= 1) return 'sprout';
  return 'seed';
}

  const isDoneCls = status === 'done' ? 'is-done' : '';

  if(isDim){
    return `
      <div class="habit-row dim">
        <span class="plant-icon">${PLANT_ICONS[stage]}</span>

          <div class="name-line"><span class="name">${escapeHtml(h.name)}</span></div>

  const goal = effectiveGoal(h, t);
  const quickBtns = (h.quickAdds||[]).map(q=>`<button data-quick="${h.id}" data-amt="${q}">+${q}</button>`).join('');
  return `

        <div class="sub-line"><span class="amt">${amt}</span> ${goal? '/ '+goal : ''} ${escapeHtml(h.unit||'')} ${status==='skipped'?' · 今天先跳過':''}</div>

          <button data-manual-btn="${h.id}" style="background:var(--moss-dim);color:var(--moss);border:none;border-radius:6px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer;">加入</button>
        </div>

      <button class="skip-link" data-skip="${h.id}">${status==='skipped'?'取消跳過':'跳過'}</button>
    </div>`;
}

async function toggleBooleanLike(habitId){
  const h = state.habits.find(x=>x.id===habitId);
  if(!h) return;
  const t = todayStr();
  if(!state.logs[habitId]) state.logs[habitId] = {};
  const cur = state.logs[habitId][t];
  const curStatus = cur ? cur.status : 'not_done';
  const newStatus = curStatus === 'done' ? 'not_done' : 'done';
  state.logs[habitId][t] = { status: newStatus, amount:0, entries: [] };
  renderToday();
  await saveState();
}
async function toggleSkip(habitId){
  const t = todayStr();
  if(!state.logs[habitId]) state.logs[habitId] = {};
  const cur = state.logs[habitId][t];
  if(cur && cur.status === 'skipped'){
    state.logs[habitId][t] = { status:'not_done', amount:0, entries: [] };
  }else{
    state.logs[habitId][t] = { status:'skipped', amount:0, entries: [] };
  }
  renderToday();
  await saveState();
}
async function addAmount(habitId, amount){
  const t = todayStr();
  if(!state.logs[habitId]) state.logs[habitId] = {};
  if(!state.logs[habitId][t]) state.logs[habitId][t] = { status:'not_done', amount:0, entries: [] };
  const log = state.logs[habitId][t];
  log.amount = (log.amount||0) + amount;
  log.entries = log.entries || [];
  log.entries.push({ amt: amount, ts: Date.now() });
  if(log.status === 'skipped') log.status = 'not_done';
  renderToday();
  await saveState();
}

      if(quickAdds.length) h.quickAdds = quickAdds;
      h.configHistory = h.configHistory || [];
      const lastGoal = h.configHistory.length ? h.configHistory[h.configHistory.length-1].goal : (h.goal ?? null);
      if(lastGoal !== goalVal){
        h.configHistory.push({ effectiveFrom: todayStr(), goal: goalVal });
      }
      delete h.goal;
    }else{
      const habit = {
        id: 'hb_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
        name, type, category, unit, quickAdds,
        executionDays, startDate, note,
        status: 'active', pausedRanges: [],
        configHistory: [{ effectiveFrom: startDate, goal: goalVal }]
      };
      state.habits.push(habit);
    }
    editingHabitId = null;
    host.innerHTML = '';
    renderAll();
    await saveState();
  });
}

/* ================= RECORDS ================= */
function renderRecords(){
  const el = document.getElementById('tab-records');
  if(state.habits.length === 0){
    el.innerHTML = `<div class="empty-state"><h3>還沒有紀錄</h3><p>種下第一個習慣後,這裡會慢慢累積故事。</p></div>`;
    return;
  }
  el.innerHTML = `
    <div class="record-narrative" id="weekNarrative"></div>
    <div class="week-dots-block" id="weekDotsBlock"></div>
    <div class="section-label">個別習慣</div>
    <div class="habit-chips" id="recHabitChips"></div>
    <div id="dots30Host"></div>
    <div class="cal-nav"><button id="calPrev">‹ 上個月</button><div class="label serif" id="calLabel">—</div><button id="calNext">下個月 ›</button></div>
    <div><div class="cal-weekdays"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div><div class="cal-days" id="calDays"></div></div>
  `;

  renderWeekBlock();
  renderRecHabitChips();
  renderDots30();
  renderCalendar();

  document.getElementById('calPrev').addEventListener('click', ()=>{ calCursor.setMonth(calCursor.getMonth()-1); renderCalendar(); });
  document.getElementById('calNext').addEventListener('click', ()=>{ calCursor.setMonth(calCursor.getMonth()+1); renderCalendar(); });
}

function renderWeekBlock(){
  const today = new Date();
  const dow = (today.getDay()+6)%7;
  const monday = new Date(today); monday.setDate(today.getDate()-dow);
  const weekDates = []; for(let i=0;i<7;i++){ const d=new Date(monday); d.setDate(monday.getDate()+i); weekDates.push(d); }

  const activeHabits = state.habits.filter(h=>h.status!=='archived');
  let totalDone=0, totalScheduled=0;
  const rows = activeHabits.map(h=>{
    let done=0, dotsHtml='';
    weekDates.forEach(d=>{
      const ds = fmt(d);
      if(d>today || ds < h.startDate){ dotsHtml += `<span class="dot faint"></span>`; return; }
      const s = dayStatus(h, ds);
      if(s==='done'){ dotsHtml += `<span class="dot done"></span>`; done++; totalDone++; totalScheduled++; }
      else if(s==='skipped'){ dotsHtml += `<span class="dot skipped"></span>`; }
      else if(passiveStatus(s)){ dotsHtml += `<span class="dot faint"></span>`; }
      else { dotsHtml += `<span class="dot"></span>`; totalScheduled++; }
    });
    return `<div class="week-dots-row"><div class="name">${escapeHtml(h.name)}</div><div class="dots">${dotsHtml}</div><div class="summary-txt">${done}/7</div></div>`;
  }).join('');

  document.getElementById('weekDotsBlock').innerHTML = rows || '<div style="color:var(--ink-muted);font-size:14px;">還沒有習慣</div>';
  const pct = totalScheduled ? Math.round(totalDone/totalScheduled*100) : 0;
  document.getElementById('weekNarrative').innerHTML = totalScheduled
    ? `這週,你照顧了花園 <b>${totalDone}</b> 次,完成率 <b>${pct}%</b>。`
    : `這週還沒有任何紀錄,從今天開始也不遲。`;
}

function renderRecHabitChips(){
  const wrap = document.getElementById('recHabitChips');
  const list = state.habits.filter(h=>h.status!=='archived');
  wrap.innerHTML = list.map(h=>`<button data-h="${h.id}" class="${h.id===recordsSelectedHabit?'active':''}">${escapeHtml(h.name)}</button>`).join('');
  wrap.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{ recordsSelectedHabit = btn.dataset.h; renderDots30(); renderCalendar(); document.querySelectorAll('#recHabitChips button').forEach(b=>b.classList.toggle('active', b===btn)); });
  });
}

function renderDots30(){
  const habit = state.habits.find(h=>h.id===recordsSelectedHabit);
  const host = document.getElementById('dots30Host');
  if(!habit){ host.innerHTML=''; return; }
  const acc = calcAccumulation(habit, 30);
  const today = new Date();
  let dotsHtml = '';
  for(let i=29;i>=0;i--){
    const d = new Date(today); d.setDate(today.getDate()-i);
    const ds = fmt(d);
    if(ds < habit.startDate){ dotsHtml += `<span class="dot faint"></span>`; continue; }
    const s = dayStatus(habit, ds);
    if(s==='done') dotsHtml += `<span class="dot done"></span>`;
    else if(s==='skipped') dotsHtml += `<span class="dot skipped"></span>`;
    else if(passiveStatus(s)) dotsHtml += `<span class="dot faint"></span>`;
    else dotsHtml += `<span class="dot"></span>`;
  }
  host.innerHTML = `<div class="record-narrative" style="font-size:15.5px;">過去 30 天,「${escapeHtml(habit.name)}」完成了 <b>${acc.done}</b> 天,完成率 <b>${acc.pct}%</b>。</div><div class="dots-30">${dotsHtml}</div>`;
}

function renderCalendar(){
  const habit = state.habits.find(h=>h.id===recordsSelectedHabit);
  const label = document.getElementById('calLabel');
  label.textContent = calCursor.getFullYear()+' 年 '+(calCursor.getMonth()+1)+' 月';
  const daysEl = document.getElementById('calDays');
  if(!habit){ daysEl.innerHTML=''; return; }

  const year = calCursor.getFullYear(), month = calCursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay()+6)%7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const t = todayStr();

  let html = '';
  for(let i=0;i<startOffset;i++) html += '<div class="cal-cell pad"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(year, month, d);
    const ds = fmt(dateObj);
    let cls = '';
    if(ds >= habit.startDate){
      const s = dayStatus(habit, ds);
      if(s==='done') cls='done'; else if(s==='partial') cls='partial'; else if(s==='skipped') cls='skipped';
    }
    if(ds === t) cls += ' today';
    html += `<div class="cal-cell ${cls}">${d}</div>`;
  }
  daysEl.innerHTML = html;
}

/* ================= Export ================= */
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '習慣花園_'+todayStr()+'.json';
  a.click();
  URL.revokeObjectURL(url);
});

/* ================= Render all ================= */
function renderAll(){
  renderToday();
  renderHabitsTab();
  if(document.getElementById('tab-records').classList.contains('active')) renderRecords();
}
</script>
